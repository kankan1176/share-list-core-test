<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>シェアリスコア 新UI 高速プレビュー</title>
<style>
:root{
  --bg:#07111e;
  --panel:#0d1828;
  --panel-2:#111f32;
  --line:#22334a;
  --text:#eef5ff;
  --muted:#91a3bb;
  --blue:#2f8cff;
  --purple:#9a6cff;
  --pink:#ff67b8;
  --green:#43d78f;
  --yellow:#ffc75b;
  --sidebar:224px;
  --dock:348px;
  --top:64px;
  --filter:54px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button,input{font:inherit}
button{color:inherit}
body{overflow:hidden}

.sidebar{
  position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);
  padding:14px 12px;
  background:
    radial-gradient(circle at 10% 0%,rgba(47,140,255,.13),transparent 28%),
    linear-gradient(180deg,#0c1726,#09131f);
  border-right:1px solid var(--line);
  display:flex;flex-direction:column;gap:10px;z-index:20
}
.brand{padding:6px 8px 12px}
.brand strong{font-size:18px}
.brand small{display:block;margin-top:3px;color:var(--muted);font-size:10px}
.mode{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:5px;
  background:#08111d;border:1px solid var(--line);border-radius:16px
}
.mode button{border:0;border-radius:11px;padding:9px 7px;background:transparent;font-weight:800;cursor:pointer}
.mode .active{background:linear-gradient(135deg,#7b58ef,#a96cff);box-shadow:0 8px 20px rgba(154,108,255,.22)}
.nav{display:flex;flex-direction:column;gap:4px;min-height:0;overflow:auto;padding-right:2px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;min-height:43px;padding:7px 9px;
  border:0;border-radius:13px;background:transparent;cursor:pointer;text-align:left;font-weight:750
}
.nav button:hover{background:#122238}
.nav .active{background:linear-gradient(135deg,rgba(154,108,255,.95),rgba(109,82,222,.9))}
.ico{width:28px;display:grid;place-items:center;font-size:18px}
.bottom{margin-top:auto;border-top:1px dashed var(--line);padding-top:10px}
.user{display:flex;align-items:center;gap:9px;padding:8px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#17273c}
.user small{display:block;color:var(--muted);font-size:10px}

.topbar{
  position:fixed;left:var(--sidebar);right:var(--dock);top:0;height:var(--top);
  z-index:15;background:rgba(7,17,30,.95);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px
}
.search{
  flex:1;max-width:720px;background:#101e30;border:1px solid #29405c;border-radius:13px;
  color:var(--text);padding:11px 14px;outline:none
}
.search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(47,140,255,.12)}
.top-user{margin-left:auto;font-size:13px;font-weight:800}

.filters{
  position:fixed;left:var(--sidebar);right:var(--dock);top:var(--top);height:var(--filter);
  z-index:14;background:#0a1524;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:8px;padding:8px 16px;overflow:auto
}
.filter{
  flex:0 0 auto;border:1px solid #2a3d57;background:#101f33;color:#dce8f8;
  border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;cursor:pointer
}
.filter.active{background:linear-gradient(135deg,#2f8cff,#5376ff);border-color:transparent;color:white}

.main{
  position:fixed;left:var(--sidebar);right:var(--dock);
  top:calc(var(--top) + var(--filter));bottom:0;padding:14px;overflow:hidden
}
.table-card{
  height:100%;border:1px solid #164e86;border-radius:14px;background:#0b1726;overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(47,140,255,.05)
}
.table-head,.row{
  display:grid;grid-template-columns:2.2fr 2fr .65fr .85fr .9fr;gap:8px;align-items:center
}
.table-head{height:42px;padding:0 12px;background:#0f1f32;border-bottom:1px solid var(--line);font-size:11px;font-weight:900;color:#a9bbd2}
.rows{height:calc(100% - 42px);overflow:auto}
.row{min-height:44px;padding:6px 12px;border-bottom:1px solid rgba(34,51,74,.65);font-size:12px}
.row:hover{background:#102238}
.song{font-weight:850}
.artist{color:#c7d5e7}
.tag{display:inline-block;padding:3px 8px;border-radius:999px;background:#17283d;color:#cfe1f7;font-size:10px;white-space:nowrap}
.row button{border:0;border-radius:8px;padding:6px 9px;background:#15263b;cursor:pointer}
.row button:hover{background:#203854}

.dock{
  position:fixed;right:0;top:0;bottom:0;width:var(--dock);z-index:30;
  background:linear-gradient(180deg,#0d1828,#09131f);border-left:1px solid var(--line);
  box-shadow:-18px 0 38px rgba(0,0,0,.22);transition:transform .22s ease
}
body.dock-collapsed .dock{transform:translateX(calc(100% - 16px))}
body.dock-collapsed .topbar,body.dock-collapsed .filters{right:0}
body.dock-collapsed .main{right:0}
.handle{
  position:absolute;left:-30px;top:18px;width:30px;height:58px;border:1px solid var(--line);border-right:0;
  border-radius:12px 0 0 12px;background:#0d1828;cursor:pointer;font-size:22px;font-weight:900
}

.dock-inner{height:100%;padding:12px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:10px}
.status-tabs{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;
  padding:5px;background:#08111d;border:1px solid var(--line);border-radius:14px
}
.status-tab{
  min-height:39px;border:0;border-radius:10px;background:transparent;color:#aebfd3;
  cursor:pointer;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:5px
}
.status-tab:hover{background:#122238;color:#fff}
.status-tab.active[data-status="reserved"]{background:linear-gradient(135deg,#e5a52f,#ffc75b);color:#15100a}
.status-tab.active[data-status="confirmed"]{background:linear-gradient(135deg,#7d5be8,#a96cff);color:#fff}
.status-tab.active[data-status="completed"]{background:linear-gradient(135deg,#2eae73,#43d78f);color:#07150e}
.status-tab .tab-count{
  min-width:20px;height:20px;padding:0 5px;border-radius:999px;display:grid;place-items:center;
  background:rgba(255,255,255,.14);font-size:9px
}
.section{display:none}
.section.active{display:flex}

.dock-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 6px}
.dock-head strong{font-size:14px}
.dock-head small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.collapse{border:1px solid var(--line);background:#101e30;border-radius:9px;padding:6px 9px;cursor:pointer;font-size:11px}
.section{min-height:0;border:1px solid var(--line);border-radius:14px;background:#0a1524;overflow:hidden;display:flex;flex-direction:column}
.section-title{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;font-size:12px;font-weight:900;border-bottom:1px solid var(--line)}
.reserved .section-title{background:linear-gradient(90deg,rgba(255,199,91,.16),transparent)}
.confirmed .section-title{background:linear-gradient(90deg,rgba(154,108,255,.17),transparent)}
.completed .section-title{background:linear-gradient(90deg,rgba(67,215,143,.15),transparent)}
.count{min-width:24px;height:21px;display:grid;place-items:center;padding:0 6px;border-radius:999px;background:#15263a;font-size:10px}
.list{min-height:0;overflow:auto;padding:6px}
.empty{text-align:center;color:var(--muted);font-size:10px;padding:16px 8px}
.item{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:7px;align-items:center;padding:7px;margin-bottom:5px;border-radius:10px;background:#0f1c2c}
.num{text-align:center;color:var(--muted);font-size:10px}
.item-title{font-size:11px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-artist{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.action{width:29px;height:29px;border:0;border-radius:8px;background:#17263a;cursor:pointer}
.action.confirm{background:rgba(154,108,255,.18)}
.action.done{background:rgba(67,215,143,.16)}
.action.back{background:rgba(255,199,91,.14)}

.notice{
  position:fixed;left:calc(var(--sidebar) + 18px);bottom:16px;z-index:40;
  background:#101f31;border:1px solid var(--line);border-radius:12px;padding:9px 12px;
  color:#b9c9dd;font-size:11px;box-shadow:0 8px 24px rgba(0,0,0,.2)
}

@media(max-width:1050px){
  :root{--dock:330px}
  .table-head,.row{grid-template-columns:2.3fr 2fr .7fr .85fr}
  .table-head>*:nth-child(4),.row>*:nth-child(4){display:none}
}
@media(max-width:820px){
  :root{--sidebar:0px}
  .sidebar{transform:translateX(-100%)}
  .dock{width:min(88vw,350px)}
  .topbar,.filters,.main{left:0}
  .table-head,.row{grid-template-columns:2.2fr 1.7fr .8fr}
  .table-head>*:nth-child(4),.row>*:nth-child(4),
  .table-head>*:nth-child(5),.row>*:nth-child(5){display:none}
  .notice{left:12px}
}
</style>
</head>
<body>
<aside class="sidebar">
  <div class="brand"><strong>ShareLiScore</strong><small>シェアリスコア UI Preview</small></div>
  <div class="mode">
    <button type="button">✨ 通常</button>
    <button type="button" class="active">🎤 ルーム</button>
  </div>
  <nav class="nav">
    <button type="button"><span class="ico">🎶</span>ルーム全曲一覧</button>
    <button type="button"><span class="ico">🤝</span>共通曲</button>
    <button type="button" class="active"><span class="ico">📝</span>予約</button>
    <button type="button"><span class="ico">🎸</span>演奏リスト</button>
    <button type="button"><span class="ico">✅</span>本日のセットリスト</button>
    <button type="button"><span class="ico">📺</span>OBS配信</button>
    <button type="button"><span class="ico">🔗</span>ルームURLをコピー</button>
    <button type="button"><span class="ico">🚪</span>ルーム退出</button>
  </nav>
  <div class="bottom">
    <div class="user"><div class="avatar">👤</div><div><strong>ゲスト</strong><small>UI確認用</small></div></div>
  </div>
</aside>

<header class="topbar">
  <input class="search" id="search" placeholder="曲名・アーティストを検索">
  <div class="top-user">👤 ゲスト</div>
</header>

<div class="filters" id="filters">
  <button class="filter active" type="button">すべて</button>
  <button class="filter" type="button">アニメ</button>
  <button class="filter" type="button">ゲーム</button>
  <button class="filter" type="button">ボカロ</button>
  <button class="filter" type="button">J-POP</button>
  <button class="filter" type="button">ロック</button>
</div>

<main class="main">
  <div class="table-card">
    <div class="table-head"><div>曲名</div><div>アーティスト</div><div>BPM</div><div>ジャンル</div><div>操作</div></div>
    <div class="rows" id="rows"></div>
  </div>
</main>

<aside class="dock">
  <button class="handle" id="handle" type="button" aria-label="パネルを格納">›</button>
  <div class="dock-inner">
    <div class="dock-head">
      <div><strong>🎛️ セッション進行</strong><small>予約 → 演奏確定 → 完了</small></div>
      <button class="collapse" id="collapse" type="button">格納</button>
    </div>

    <div class="status-tabs" role="tablist" aria-label="進行状態">
      <button class="status-tab active" type="button" data-status="reserved" role="tab" aria-selected="true">
        📝 予約 <span class="tab-count" id="reservedTabCount">0</span>
      </button>
      <button class="status-tab" type="button" data-status="confirmed" role="tab" aria-selected="false">
        🎸 確定 <span class="tab-count" id="confirmedTabCount">0</span>
      </button>
      <button class="status-tab" type="button" data-status="completed" role="tab" aria-selected="false">
        ✅ 完了 <span class="tab-count" id="completedTabCount">0</span>
      </button>
    </div>

    <section class="section reserved active" data-panel="reserved">
      <div class="section-title"><span>📝 予約</span><span class="count" id="reservedCount">0</span></div>
      <div class="list" id="reservedList"></div>
    </section>

    <section class="section confirmed" data-panel="confirmed">
      <div class="section-title"><span>🎸 演奏確定</span><span class="count" id="confirmedCount">0</span></div>
      <div class="list" id="confirmedList"></div>
    </section>

    <section class="section completed" data-panel="completed">
      <div class="section-title"><span>✅ 完了</span><span class="count" id="completedCount">0</span></div>
      <div class="list" id="completedList"></div>
    </section>
  </div>
</aside>

<div class="notice">高速UIプレビュー：Firebase・外部通信なし</div>

<script>
(()=>{
  const catalog = [
    {id:1,title:"Before I Rise",artist:"やなぎなぎ",bpm:"148",genre:"アニメ"},
    {id:2,title:"透明な夜",artist:"Sample Band",bpm:"132",genre:"J-POP"},
    {id:3,title:"Blue Signal",artist:"Demo Project",bpm:"156",genre:"ゲーム"},
    {id:4,title:"夕焼けセッション",artist:"ShareLiScore",bpm:"120",genre:"ロック"},
    {id:5,title:"Midnight Drive",artist:"Studio Friends",bpm:"138",genre:"J-POP"},
    {id:6,title:"アンコール",artist:"Session Members",bpm:"126",genre:"アニメ"},
    {id:7,title:"Starry Voice",artist:"Miku Demo",bpm:"164",genre:"ボカロ"},
    {id:8,title:"Next Stage",artist:"Live Project",bpm:"145",genre:"ロック"},
    {id:9,title:"虹色コード",artist:"Music Lab",bpm:"118",genre:"ゲーム"},
    {id:10,title:"Session Time",artist:"ShareLiScore",bpm:"134",genre:"J-POP"}
  ];

  let queue = [
    {qid:"q1",songId:2,status:"reserved"},
    {qid:"q2",songId:3,status:"reserved"},
    {qid:"q3",songId:4,status:"confirmed"},
    {qid:"q4",songId:5,status:"completed"},
    {qid:"q5",songId:6,status:"completed"}
  ];
  let currentGenre = "すべて";
  let currentQuery = "";

  const rows = document.getElementById("rows");
  const search = document.getElementById("search");

  function songById(id){ return catalog.find(s=>s.id===id); }

  function renderTable(){
    const q = currentQuery.trim().toLowerCase();
    rows.replaceChildren();
    catalog
      .filter(s=>currentGenre==="すべて" || s.genre===currentGenre)
      .filter(s=>!q || (s.title+" "+s.artist).toLowerCase().includes(q))
      .forEach(s=>{
        const row=document.createElement("div"); row.className="row";
        const a=document.createElement("div"); a.className="song"; a.textContent=s.title;
        const b=document.createElement("div"); b.className="artist"; b.textContent=s.artist;
        const c=document.createElement("div"); c.textContent=s.bpm;
        const d=document.createElement("div"); const tag=document.createElement("span"); tag.className="tag"; tag.textContent=s.genre; d.appendChild(tag);
        const e=document.createElement("div"); const btn=document.createElement("button"); btn.type="button"; btn.textContent="予約";
        btn.addEventListener("click",()=>{
          queue.push({qid:"q"+Date.now(),songId:s.id,status:"reserved"});
          renderDock();
          selectDockStatus("reserved");
        });
        e.appendChild(btn);
        row.append(a,b,c,d,e); rows.appendChild(row);
      });
  }

  function move(qid,status){
    const item=queue.find(x=>x.qid===qid);
    if(item){
      item.status=status;
      renderDock();
      selectDockStatus(status);
    }
  }

  function makeList(status,el,countEl){
    const items=queue.filter(x=>x.status===status);
    countEl.textContent=String(items.length);
    el.replaceChildren();
    if(!items.length){
      const emp=document.createElement("div"); emp.className="empty";
      emp.textContent=status==="reserved"?"予約はありません":status==="confirmed"?"確定曲はありません":"完了曲はありません";
      el.appendChild(emp);return;
    }
    items.forEach((it,i)=>{
      const s=songById(it.songId); if(!s)return;
      const row=document.createElement("div"); row.className="item";
      const num=document.createElement("div"); num.className="num"; num.textContent=String(i+1);
      const mid=document.createElement("div");
      const t=document.createElement("div"); t.className="item-title"; t.textContent=s.title;
      const ar=document.createElement("div"); ar.className="item-artist"; ar.textContent=s.artist;
      mid.append(t,ar);
      const btn=document.createElement("button"); btn.type="button"; btn.className="action";
      if(status==="reserved"){btn.textContent="🎸";btn.classList.add("confirm");btn.title="演奏確定";btn.addEventListener("click",()=>move(it.qid,"confirmed"))}
      if(status==="confirmed"){btn.textContent="✅";btn.classList.add("done");btn.title="完了";btn.addEventListener("click",()=>move(it.qid,"completed"))}
      if(status==="completed"){btn.textContent="↩";btn.classList.add("back");btn.title="演奏確定へ戻す";btn.addEventListener("click",()=>move(it.qid,"confirmed"))}
      row.append(num,mid,btn);el.appendChild(row);
    });
  }

  function renderDock(){
    makeList("reserved",document.getElementById("reservedList"),document.getElementById("reservedCount"));
    makeList("confirmed",document.getElementById("confirmedList"),document.getElementById("confirmedCount"));
    makeList("completed",document.getElementById("completedList"),document.getElementById("completedCount"));

    const counts = {
      reserved: queue.filter(x=>x.status==="reserved").length,
      confirmed: queue.filter(x=>x.status==="confirmed").length,
      completed: queue.filter(x=>x.status==="completed").length
    };
    document.getElementById("reservedTabCount").textContent=String(counts.reserved);
    document.getElementById("confirmedTabCount").textContent=String(counts.confirmed);
    document.getElementById("completedTabCount").textContent=String(counts.completed);
  }

  function selectDockStatus(status){
    document.querySelectorAll(".status-tab").forEach(btn=>{
      const active=btn.dataset.status===status;
      btn.classList.toggle("active",active);
      btn.setAttribute("aria-selected",String(active));
    });
    document.querySelectorAll(".section[data-panel]").forEach(panel=>{
      panel.classList.toggle("active",panel.dataset.panel===status);
    });
  }

  document.querySelectorAll(".status-tab").forEach(btn=>{
    btn.addEventListener("click",()=>selectDockStatus(btn.dataset.status));
  });

  search.addEventListener("input",()=>{currentQuery=search.value;renderTable()});
  document.querySelectorAll(".filter").forEach(btn=>btn.addEventListener("click",()=>{
    document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active"); currentGenre=btn.textContent; renderTable();
  }));

  function toggleDock(forceCollapsed){
    const next = typeof forceCollapsed==="boolean" ? forceCollapsed : !document.body.classList.contains("dock-collapsed");
    document.body.classList.toggle("dock-collapsed",next);
    document.getElementById("collapse").textContent=next?"表示":"格納";
    document.getElementById("handle").textContent=next?"‹":"›";
  }
  document.getElementById("handle").addEventListener("click",()=>toggleDock());
  document.getElementById("collapse").addEventListener("click",()=>toggleDock(true));

  renderTable();
  renderDock();
})();
</script>
</body>
</html>
